<style>
:root{
  --paper:#F4F6F8; --panel:#FFFFFF; --ink:#16212B; --ink-2:#4A5763; --ink-3:#5E6B76; --rule:#D6DDE3;
  --accent:#1F5F45; --accent-ink:#FFFFFF;
  --new:#1D6FA5; --new-bg:#E4EFF7;
  --soon:#9A4F08; --soon-bg:#FBEEDD;
  --open:#1F5F45; --open-bg:#E3F0E9;
  --retired:#5A636E; --retired-bg:#E9ECEF;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121A20; --panel:#1A242C; --ink:#E6EBEF; --ink-2:#AEB9C3; --ink-3:#7F8B95; --rule:#2C3841;
  --accent:#5DB48C; --accent-ink:#0E1A14;
  --new:#6FB2E4; --new-bg:#1B3245; --soon:#E8A25A; --soon-bg:#3E2A14;
  --open:#5DB48C; --open-bg:#173125; --retired:#98A3AD; --retired-bg:#28313A;
}}
:root[data-theme="dark"]{
  --paper:#121A20; --panel:#1A242C; --ink:#E6EBEF; --ink-2:#AEB9C3; --ink-3:#7F8B95; --rule:#2C3841;
  --accent:#5DB48C; --accent-ink:#0E1A14;
  --new:#6FB2E4; --new-bg:#1B3245; --soon:#E8A25A; --soon-bg:#3E2A14;
  --open:#5DB48C; --open-bg:#173125; --retired:#98A3AD; --retired-bg:#28313A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-wrap:break-word}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--rule);background:var(--panel)}
header .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:28px 20px 20px}
h1{font-family:var(--display);font-weight:500;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}
.tagline{color:var(--ink-2);margin:6px 0 0;max-width:60ch}
.meta{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);text-align:right}
.meta a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)}
.lang{margin-left:12px;font-family:var(--body);font-size:.85rem}
.lang:empty{display:none}
.lang button{background:none;border:1px solid var(--rule);border-radius:3px;color:var(--ink-2);padding:2px 8px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:24px 0 16px;background:var(--panel)}
.stat{padding:14px 16px;border-right:1px solid var(--rule);cursor:pointer;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;font:inherit;color:inherit}
.stat:last-child{border-right:0}
.stat[aria-pressed="true"]{background:var(--paper);box-shadow:inset 0 -3px 0 var(--c)}
.stat .n{font-family:var(--display);font-size:2rem;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.stat .h{font-size:.82rem;color:var(--ink-3);margin-top:2px}

.subscribe{border:1px solid var(--rule);border-radius:4px;background:var(--panel);padding:14px 16px;margin:0 0 18px}
.subscribe h2{font-size:1rem;margin:0 0 4px}
.subscribe p{margin:0 0 8px;font-size:.9rem;max-width:70ch}
.subscribe form{display:flex;flex-wrap:wrap;gap:8px}
.subscribe input[type=email]{flex:1 1 220px;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;font:inherit}
.subscribe button{padding:7px 14px;border:0;border-radius:3px;background:var(--accent);color:var(--accent-ink);font:inherit;cursor:pointer}
.subscribe .fine{font-size:.78rem;color:var(--ink-3);margin:8px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 18px;font-size:.9rem}
.filters input[type=search]{flex:1 1 220px;padding:7px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);font:inherit}
.filters select{padding:7px 8px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);font:inherit}
.chip{border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;font:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#topics{display:flex;flex-wrap:wrap;gap:8px;min-width:0}

.list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:6px 150px 1fr;gap:0 18px;border-bottom:1px solid var(--rule);padding:16px 0 16px 0}
.item .stripe{background:var(--c);border-radius:2px;margin:2px 0}
.item.retired{opacity:.85}
.when{font-family:var(--mono);font-size:.8rem;color:var(--ink-2);line-height:1.6}
.when b,.when span{display:block}
.when b{color:var(--c);font-weight:500}
.when .d{color:var(--ink-3)}
.item h3{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
.item h3 a{color:var(--ink);text-decoration:none}
.item h3 a:hover,.item h3 a:focus{text-decoration:underline;text-decoration-color:var(--accent)}
.body{font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.body .type{text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;color:var(--ink-3);margin-left:8px}
.badges{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.badge{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:3px;background:var(--bg);color:var(--c);font-weight:600}
.item p{margin:0 0 6px;max-width:68ch}
.why{color:var(--ink-2)}
.how{font-size:.9rem}
.how strong{color:var(--accent)}
.topics{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.topic{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:0 6px}
.unverified{font-size:.72rem;color:var(--soon);font-family:var(--mono)}

/* Add-to-calendar: a per-item menu, and a dialog for the whole set. */
.cal{position:relative;display:inline-block;margin-top:10px}
.cal-btn{font:inherit;font-size:.82rem;color:var(--ink-2);background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:4px 10px;cursor:pointer}
.cal-btn:hover,.cal-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.cal-menu{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.16);padding:4px;display:flex;flex-direction:column}
.cal-menu[hidden]{display:none}  /* the class sets display:flex, which would beat the UA [hidden] rule */
.cal-menu a,.cal-menu button{font:inherit;font-size:.85rem;text-align:left;padding:7px 10px;border:0;border-radius:3px;background:none;color:var(--ink);text-decoration:none;cursor:pointer}
.cal-menu a:hover,.cal-menu button:hover{background:var(--paper);color:var(--accent)}
.cal-all{font:inherit;font-size:.88rem;font-weight:600;margin-left:auto;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:3px;padding:7px 12px;cursor:pointer}
dialog#calbox{border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);max-width:460px;width:calc(100% - 32px);padding:22px 24px 24px;font:inherit}
dialog#calbox::backdrop{background:rgba(10,16,22,.45)}
#calbox h2{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0 0 8px;padding-right:24px}
#calbox p{margin:0 0 12px;font-size:.9rem;color:var(--ink-2)}
#calbox p.note{font-size:.82rem;color:var(--ink-3)}
#calbox hr{border:0;border-top:1px solid var(--rule);margin:18px 0 14px}
#calbox .x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--ink-3);font-size:1.4rem;line-height:1;cursor:pointer;padding:2px 6px}
.calrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.calopt{font:inherit;font-size:.87rem;padding:7px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);color:var(--ink);text-decoration:none;cursor:pointer}
.calopt:hover{border-color:var(--accent);color:var(--accent)}

.empty{padding:40px 0;color:var(--ink-3);text-align:center}
footer{margin:36px 0 40px;font-size:.85rem;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:16px}
footer p{max-width:70ch}
footer .forks a{margin-right:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--new);outline-offset:2px}
@media (max-width:720px){
  .wrap{padding:0 16px}
  header .wrap{align-items:flex-start;gap:12px;padding:22px 16px 16px}
  .meta{text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .lang{margin-left:0}
  .lang button{padding:6px 12px}
  .stats{grid-template-columns:repeat(2,1fr)} .stat:nth-child(2){border-right:0} .stat:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .stat{padding:12px 14px}
  /* 16px keeps iOS Safari from zooming in when a field takes focus */
  .filters input[type=search]{flex:1 1 100%;font-size:16px}
  .filters select{flex:1 1 calc(50% - 5px);min-width:0;font-size:16px}
  #topics{flex:1 1 100%}
  /* the French label runs 324px, which overflows a 320px screen; full-width like the search box */
  .cal-all{flex:1 1 100%;margin-left:0}
  .chip{padding:7px 12px;font-size:.82rem}
  .item{grid-template-columns:6px 1fr;gap:0 12px}
  .when{grid-column:2;display:flex;flex-wrap:wrap;gap:0 10px;margin-bottom:6px}
  .when b,.when span{display:inline}
  .main{grid-column:2;min-width:0}
  .body{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
  .body .type,.badges{margin-left:0}
}
@media (max-width:420px){
  h1{font-size:1.6rem}
  .stat{padding:10px 12px}
  .stat .n{font-size:1.7rem}
  .stat .h{font-size:.76rem}
  .item h3{font-size:1.15rem}
}
@media (prefers-reduced-motion:no-preference){.stat,.chip{transition:background .15s}}
/* Section headings that give the page a real outline without changing the look. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:8px;top:8px;z-index:10;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:3px;text-decoration:none}
.count{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);margin:0 0 6px}
</style>

<header><div class="wrap">
  <div>
    <h1 data-i18n="title">Site name</h1>
    <p class="tagline" data-i18n="tagline">Tagline</p>
  </div>
  <div class="meta">
    <span class="links" data-i18n="links_line">built __BUILT__</span>
    <span class="lang" id="lang-toggle" role="group" data-i18n-aria-label="language_toggle" aria-label="Language"><!--__LANG_BUTTONS__--></span>
  </div>
</div></header>

<main class="wrap" id="main">
  <section aria-labelledby="glance-h">
    <h2 id="glance-h" class="sr-only" data-i18n="at_a_glance">At a glance</h2>
    <div class="stats" id="stats"><!--__STATS__--></div>
  </section>

  <!--__NEWSLETTER__-->

  <section aria-labelledby="filters-h">
    <h2 id="filters-h" class="sr-only" data-i18n="search_and_filter">Search and filter</h2>
    <div class="filters" id="filters" role="search">
      <label class="sr-only" for="q" data-i18n="search_label">Search</label>
      <input type="search" id="q" data-i18n-placeholder="search_placeholder" placeholder="Search…">
      <label class="sr-only" for="type" data-i18n="filter_type">Filter by type</label>
      <select id="type"><option value="" data-i18n="all_types">All types</option></select>
      <label class="sr-only" for="body" data-i18n="filter_body">Filter by body</label>
      <select id="body"><option value="" data-i18n="all_bodies">All bodies</option></select>

      <button class="cal-all" id="cal-all" type="button" aria-haspopup="dialog">📅 <span data-i18n="all_cal">Add all deadlines to my calendar</span></button>
    </div>
  </section>

    <h2 id="items-h" class="sr-only" data-i18n="monitored_items">Monitored items</h2>

<script>
const DATA = /*__DATA__*/[];
const CFG = /*__CONFIG__*/{};
// UI strings per language, from pipeline/strings/<lang>.yaml merged with the site's own
// text in data/site.yaml. build.py fills the same strings into the HTML above for the
// primary language, so the first paint needs no JavaScript.
const L = /*__L__*/{};
const SITE=CFG.site, PRIMARY=CFG.primary, LANGS=CFG.langs;
let statusFilter="", topicFilter="";
// ?lang=<code> wins over the stored choice, so a translated URL is shareable and crawlable.
let lang=new URLSearchParams(location.search).get("lang");
if(!LANGS.includes(lang)){lang=null;try{lang=localStorage.getItem("lang")}catch(e){}}
if(!LANGS.includes(lang))lang=PRIMARY;

const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function primary(r){return r.badges.includes("retired")?"retired":r.badges.includes("closing_soon")?"closing_soon":r.badges.includes("new")?"new":"open"}
const fmt=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
// zero/one/other forms, formatted with {n} and anything else passed in.
const plural=(forms,n,o={})=>{if(typeof forms==="string")return fmt(forms,{n,...o});
  const f=(n===0&&forms.zero)||(n===1&&forms.one)||forms.other;return fmt(f,{n,...o})};
// Translated text falls back to the primary language so a not-yet-translated item is still readable.
const tr=(r,f)=>(lang!==PRIMARY&&r[f+"_"+lang])?r[f+"_"+lang]:r[f];
const topicLabel=x=>(L[lang].topic||{})[x]||x;
// ISO dates read as-is where the strings file says so; otherwise the locale's short form.
const fmtDate=iso=>{if(L[lang].date_style!=="long")return iso;const[y,m,d]=iso.split("-").map(Number);
  return new Intl.DateTimeFormat(CFG.locales[lang]||lang,{day:"numeric",month:"short",year:"numeric"}).format(new Date(y,m-1,d))};
const COLOR={new:"var(--new)",closing_soon:"var(--soon)",open:"var(--open)",retired:"var(--retired)"};
const BG={new:"var(--new-bg)",closing_soon:"var(--soon-bg)",open:"var(--open-bg)",retired:"var(--retired-bg)"};

// ---- add to calendar -------------------------------------------------------
// Google and Outlook take one event per URL, so single deadlines go through
// their web templates and anything bulk goes through .ics — either the
// published feed (subscribe, stays current) or a generated file (import once).
// The published feed is written once per language, like feed.xml and digest.md,
// so every subscribe link follows the current language toggle.
const icsUrl=()=>SITE+"/"+L[lang].ics_file;
const webcalUrl=()=>icsUrl().replace(/^https?:/,"webcal:");
const googleSub=()=>"https://calendar.google.com/calendar/r?cid="+encodeURIComponent(webcalUrl());
const outlookSub=()=>"https://outlook.live.com/calendar/0/addfromweb?"+
  "url="+encodeURIComponent(icsUrl())+"&name="+encodeURIComponent(L[lang].text.title);
const qs=o=>Object.entries(o).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
const ymd=s=>s.replace(/-/g,"");
function nextDay(s){const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10)}
// r.status is frozen at build time and the site is rebuilt on a fixed cadence, so a
// deadline can pass between builds. Re-check against the reader's own calendar
// date: a closed deadline is not worth adding, least of all in a bulk download.
const todayISO=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const upcoming=r=>!!r.closes&&r.status==="open"&&r.closes>=todayISO();
function dated(){return DATA.filter(upcoming)}

function calText(r){
  const t=L[lang], parts=[tr(r,"body"),tr(r,"summary"),t.why+" "+tr(r,"why_it_matters")];
  if(r.how_to_participate)parts.push(t.how+" "+tr(r,"how_to_participate"));
  if(!r.verified)parts.push("⚠ "+t.cal_unverified);
  parts.push(r.url,t.cal_tracked+" "+SITE);
  return {title:t.deadline_prefix+" "+tr(r,"title"),details:parts.join("\n")};
}
function googleUrl(r){
  const c=calText(r);
  return "https://calendar.google.com/calendar/render?"+qs({
    action:"TEMPLATE",text:c.title,details:c.details,
    dates:ymd(r.closes)+"/"+ymd(nextDay(r.closes))});
}
function outlookUrl(r){
  const c=calText(r);
  return "https://outlook.live.com/calendar/0/deeplink/compose?"+qs({
    path:"/calendar/action/compose",rru:"addevent",subject:c.title,body:c.details,
    startdt:r.closes,enddt:nextDay(r.closes),allday:"true"});
}

// Mirrors pipeline/build.py so a downloaded file and the published feed agree.
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsFold(line){
  const enc=new TextEncoder(),out=[];let cur="",used=0,limit=75;
  for(const ch of line){const n=enc.encode(ch).length;
    if(used+n>limit){out.push(cur);cur="";used=0;limit=74}
    cur+=ch;used+=n}
  out.push(cur);return out.join("\r\n ");
}
function icsEvent(r,stamp){
  const t=L[lang], c=calText(r), out=["BEGIN:VEVENT",
    "UID:"+r.id+"@"+CFG.slug,"DTSTAMP:"+stamp,"LAST-MODIFIED:"+stamp,
    "DTSTART;VALUE=DATE:"+ymd(r.closes),"DTEND;VALUE=DATE:"+ymd(nextDay(r.closes)),
    "SUMMARY:"+icsEsc(c.title),"DESCRIPTION:"+icsEsc(c.details),"URL:"+icsEsc(r.url),"TRANSP:TRANSPARENT"];
  if(r.topics.length)out.push("CATEGORIES:"+r.topics.map(icsEsc).join(","));
  [["-P7D",t.alarm_7],["-P1D",t.alarm_1]].forEach(([trg,label])=>out.push(
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(fmt(label,{x:tr(r,"title")})),
    "TRIGGER;VALUE=DURATION:"+trg,"END:VALARM"));
  out.push("END:VEVENT");return out;
}
function icsFile(rows){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  let out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//"+CFG.name+"//v"+CFG.version+"//EN",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+icsEsc(L[lang].text.title)];
  rows.forEach(r=>{out=out.concat(icsEvent(r,stamp))});
  out.push("END:VCALENDAR");
  return out.map(icsFold).join("\r\n")+"\r\n";
}
function downloadIcs(name,rows){
  const url=URL.createObjectURL(new Blob([icsFile(rows)],{type:"text/calendar;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function closeMenus(){document.querySelectorAll(".cal-menu").forEach(m=>m.hidden=true);
  document.querySelectorAll(".cal-btn").forEach(b=>b.setAttribute("aria-expanded","false"))}
function calMenu(r){
  const t=L[lang];
  return `<div class="cal">
    <button class="cal-btn" data-cal="${esc(r.id)}" aria-expanded="false" aria-haspopup="true">📅 ${esc(t.add_cal)}</button>
    <div class="cal-menu" role="menu" hidden>
      <a role="menuitem" href="${esc(googleUrl(r))}" target="_blank" rel="noopener">Google Calendar</a>
      <a role="menuitem" href="${esc(outlookUrl(r))}" target="_blank" rel="noopener">Outlook</a>
      <button role="menuitem" data-ics="${esc(r.id)}">${esc(t.ics_one)}</button>
    </div></div>`;
}
function wireItemMenus(){
  document.querySelectorAll(".cal-btn").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const menu=b.nextElementSibling, open=menu.hidden;
    closeMenus();menu.hidden=!open;b.setAttribute("aria-expanded",String(open));
  });
  document.querySelectorAll(".cal-menu").forEach(m=>m.addEventListener("click",e=>e.stopPropagation()));
  document.querySelectorAll("[data-ics]").forEach(b=>b.onclick=()=>{
    const r=DATA.find(x=>x.id===b.dataset.ics);
    downloadIcs(r.id+".ics",[r]);closeMenus();
  });
}

function renderCalBox(){
  const t=L[lang], rows=dated(), n=rows.length;
  $("#calbox").innerHTML=`<button class="x" id="calbox-x" aria-label="${esc(t.close)}">&times;</button>
    <h2 id="calbox-title">${esc(t.all_title)}</h2>
    <p>${esc(n?plural(t.all_intro,n):t.no_dated)}</p>
    <p class="note"><b>${esc(t.sub_head)}</b></p>
    <div class="calrow">
      <a class="calopt" href="${esc(googleSub())}" target="_blank" rel="noopener">Google Calendar</a>
      <a class="calopt" href="${esc(outlookSub())}" target="_blank" rel="noopener">Outlook</a>
      <a class="calopt" href="${esc(webcalUrl())}">${esc(t.apple_sub)}</a>
      <button class="calopt" id="calcopy">${esc(t.copy_link)}</button>
    </div>
    <p class="note">${t.sub_note}</p>
    ${n?`<hr><p class="note"><b>${esc(t.once_head)}</b></p>
    <div class="calrow"><button class="calopt" id="caldl">${esc(plural(t.download,n))}</button></div>
    <p class="note">${esc(t.once_note)}</p>`:""}
    <hr><p class="note">${esc(t.cal_fine)}</p>`;
  $("#calbox-x").onclick=()=>$("#calbox").close();
  $("#calcopy").onclick=async e=>{
    const url=icsUrl();
    try{await navigator.clipboard.writeText(url)}
    catch(err){const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);
      ta.select();try{document.execCommand("copy")}catch(e2){}ta.remove()}
    e.target.textContent=t.copied;setTimeout(()=>{e.target.textContent=t.copy_link},1800);
  };
  if(n)$("#caldl").onclick=()=>downloadIcs(CFG.slug+"-deadlines.ics",rows);
}
document.addEventListener("click",closeMenus);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenus()});
$("#cal-all").onclick=()=>{renderCalBox();$("#calbox").showModal()};

function renderStats(){
  const t=L[lang];
  const counts={new:0,open:0,closing_soon:0,retired:0};
  DATA.forEach(r=>r.badges.forEach(b=>counts[b]++));
  $("#stats").innerHTML=["new","open","closing_soon","retired"].map(k=>
    `<button class="stat" style="--c:${COLOR[k]}" data-k="${k}" aria-pressed="${statusFilter===k}">
      <div class="n">${counts[k]}</div><div class="l">${t.badge[k]}</div><div class="h">${t.badge_hint[k]}</div></button>`).join("");
  document.querySelectorAll(".stat").forEach(b=>b.onclick=()=>{statusFilter=statusFilter===b.dataset.k?"":b.dataset.k;render()});
}
function renderFilters(){
  const t=L[lang];
  const types=[...new Set(DATA.map(r=>r.type))];
  $("#type").innerHTML=`<option value="">${esc(t.all_types)}</option>`+types.map(x=>`<option value="${x}">${t.type[x]||x}</option>`).join("");
  const bodies=[...new Map(DATA.map(r=>[r.body,r])).values()].sort((a,b)=>tr(a,"body").localeCompare(tr(b,"body"),CFG.locales[lang]||lang));
  $("#body").innerHTML=`<option value="">${esc(t.all_bodies)}</option>`+bodies.map(r=>`<option value="${esc(r.body)}">${esc(tr(r,"body"))}</option>`).join("");
  const tc={};DATA.forEach(r=>r.topics.forEach(x=>tc[x]=(tc[x]||0)+1));
  const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("#topics").innerHTML=top.map(([x,n])=>`<button class="chip" data-t="${x}" aria-pressed="${topicFilter===x}">${esc(topicLabel(x))} <span style="opacity:.6">${n}</span></button>`).join(" ");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{topicFilter=topicFilter===b.dataset.t?"":b.dataset.t;render()});
}
const haystack=r=>LANGS.flatMap(l=>["title","body","summary"].map(f=>r[f+(l===PRIMARY?"":"_"+l)]||""))
  .concat(r.topics.join(" "),r.topics.map(topicLabel).join(" ")).join(" ").toLowerCase();
function renderList(){
  const t=L[lang], q=$("#q").value.toLowerCase(), ty=$("#type").value, bo=$("#body").value;
  const rows=DATA.filter(r=>
    (!statusFilter||r.badges.includes(statusFilter)) && (!topicFilter||r.topics.includes(topicFilter)) &&
    (!ty||r.type===ty) && (!bo||r.body===bo) && (!q||haystack(r).includes(q)));
  setCount(rows.length,DATA.length);
  if(!rows.length){$("#list").innerHTML=`<div class="empty">${t.empty}</div>`;return}
  $("#list").innerHTML=rows.map(r=>{
    const p=primary(r);
    const title=tr(r,"title");
    const when = r.closes
      ? `<b>${p==="retired"?t.closed:t.closes} <time datetime="${esc(r.closes)}">${fmtDate(r.closes)}</time></b>${r.days_left!=null?`<span>${plural(t.days_left,r.days_left)}</span>`:""}`
      : `<b>${esc(t.no_deadline)}</b>`;
    const opened = r.opened?`<span class="d">${esc(t.opened)} <time datetime="${esc(r.opened)}">${fmtDate(r.opened)}</time></span>`:"";
    const badges=r.badges.filter(b=>b!=="open"||r.badges.length===1).map(b=>`<span class="badge" style="--c:${COLOR[b]};--bg:${BG[b]}">${t.badge[b]}</span>`).join("");
    return `<article class="item ${p}" id="item-${esc(r.id)}" style="--c:${COLOR[p]}">
      <div class="stripe" aria-hidden="true"></div>
      <div class="when">${when}${opened}</div>
      <div class="main">
        <h3><a href="${esc(r.url)}" rel="noopener external">${esc(title)}</a></h3>
        <div class="body">${esc(tr(r,"body"))}<span class="type">${t.type[r.type]||r.type}</span><span class="badges">${badges}</span>${r.verified?"":` <span class="unverified" title="${esc(t.unverified)}">⚠</span>`}</div>
        <p>${esc(tr(r,"summary"))}</p>
        <p class="why"><em>${esc(t.why)}</em> ${esc(tr(r,"why_it_matters"))}</p>
        ${r.how_to_participate?`<p class="how"><strong>${esc(t.how)}</strong> ${esc(tr(r,"how_to_participate"))}</p>`:""}
        <div class="topics">${r.topics.map(x=>`<span class="topic">${esc(topicLabel(x))}</span>`).join("")}</div>
        ${upcoming(r)?calMenu(r):""}
      </div></article>`;}).join("");
  wireItemMenus();
}
function setCount(n,total){$("#count").textContent=plural(L[lang].count,n,{total})}
function applyLang(){
  const t=L[lang], get=k=>t[k]??t.text[k];
  document.documentElement.lang=CFG.locales[lang]||lang;
  document.title=t.text.page_title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=get(el.dataset.i18n);if(v!=null&&el.tagName!=="TITLE")el.innerHTML=v});
  ["placeholder","aria-label","content"].forEach(a=>document.querySelectorAll(`[data-i18n-${a}]`).forEach(el=>{
    const v=get(el.getAttribute(`data-i18n-${a}`));if(v!=null)el.setAttribute(a,v)}));
  document.querySelectorAll("#lang-toggle button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
function render(skipList){
  applyLang();renderStats();renderFilters();
  // skipList leaves build.py's server-rendered list in place, so its calendar
  // buttons still need their handlers attached.
  if(skipList){setCount(DATA.length,DATA.length);wireItemMenus()}else renderList();
  if($("#calbox").open)renderCalBox();
  // The subscribe form (rendered by build.py only when site.yaml names an account) tags
  // the reader with the language they were reading in.
  const nlTag=$("#nl-tag");if(nlTag)nlTag.value=lang;
}
["#q","#type","#body"].forEach(s=>$(s).addEventListener("input",renderList));
function setLang(x){
  lang=x;
  try{localStorage.setItem("lang",x)}catch(e){}
  const u=new URL(location.href);
  if(x!==PRIMARY)u.searchParams.set("lang",x); else u.searchParams.delete("lang");
  try{history.replaceState(null,"",u.pathname+u.search+u.hash)}catch(e){}
  render();
}
document.querySelectorAll("#lang-toggle button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
// Engagement events, counted only when site.yaml names an analytics endpoint and the
// counter script has loaded. Each event is a path under /event/: which item link was
// followed, which calendar option was used, which feed was opened. No identifiers.
const track=p=>{try{if(CFG.analytics&&window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:"/event/"+p,event:true})}catch(e){}};
document.addEventListener("click",e=>{
  const el=e.target.closest("a[href],button,.stat,.chip");if(!el)return;
  const item=el.closest("article.item"),id=item?item.id.replace(/^item-/,""):"";
  if(el.matches("#list h3 a"))track("out/"+id);
  else if(el.matches("a[role=menuitem]"))track("cal/item/"+(/google/i.test(el.textContent)?"google":"outlook"));
  else if(el.matches("[data-ics]"))track("cal/item/ics");
  else if(el.id==="caldl")track("cal/all/ics");
  else if(el.closest("#nl-form"))track("newsletter/subscribe");
  else if(el.matches("a.calopt"))track("cal/all/"+((el.getAttribute("href")||"").startsWith("webcal")?"webcal":/google/i.test(el.textContent)?"google":"outlook"));
  else if(el.id==="cal-all")track("cal/all/open");
  else if(el.closest("#lang-toggle"))track("lang/"+el.dataset.lang);
  else if(el.matches(".chip"))track("topic/"+el.dataset.t);
  else if(el.matches(".stat"))track("status/"+el.dataset.k);
  else if(el.matches(".links a"))track("link/"+el.getAttribute("href"));
  else if(el.matches(".forks a"))track("fork/"+el.hostname);
},true);
// build.py already wrote the primary-language, unfiltered list into #list, so the first
// paint needs no client render: crawlers and browsers end up with identical markup.
render(lang===PRIMARY);
</script>
</body>
</html>
