footer_status: >-
  Prototype. Les étiquettes sont calculées à partir des dates de clôture annoncées :
  <b>Nouveau</b> = ouvert ou repéré au cours des 14 derniers jours ; <b>Se termine bientôt</b>
  = clôture dans les 7 jours ; <b>Retiré</b> = date de clôture dépassée ou retiré. Les éléments
  marqués ⚠ n'ont pas encore été vérifiés par une personne. Vérifiez toujours les échéances sur
  la page officielle avant de soumettre.
