# English UI strings. Shared by the site (template.html), the feeds, the calendar and
# the digest. Nothing here names a place; site-specific prose is in data/site.yaml.
#
# Plural forms: keys with zero/one/other are chosen by count and formatted with {n}.
# `date_style` is iso (2026-09-23 as written) or long (formatted for the locale).

language_name: English          # shown on the toggle
language_name_en: English       # used in English prose and the classifier prompt
date_style: iso
sep: ": "                      # between a label and its value in generated text

badge:
  new: New
  closing_soon: Closing soon
  open: Open
  retired: Retired
badge_hint:
  new: opened in last 14 days
  closing_soon: deadline within 7 days
  open: accepting input now
  retired: past deadline or withdrawn
type:
  consultation: Consultation
  call_for_briefs: Call for briefs
  regulatory_notice: Regulatory notice
  funding_call: Funding call
  standards_review: Standards review
  petition: Petition
  other: Other
topic: {}                      # labels for topic slugs; a missing key shows the slug itself

closes: Closes
closed: Closed
opened: Opened
no_deadline: No stated deadline
days_left:
  zero: closes today
  one: 1 day left
  other: "{n} days left"
why: "Why it matters:"
how: "How to participate:"
empty: Nothing matches these filters.
unverified: Not yet checked by a human
count:
  one: "Showing {n} of {total} items"
  other: "Showing {n} of {total} items"

# page furniture
skip: Skip to the list of consultations
at_a_glance: At a glance
search_and_filter: Search and filter
search_label: Search titles, departments, topics
search_placeholder: Search titles, departments, topics…
filter_type: Filter by type
all_types: All types
filter_body: Filter by department
all_bodies: All departments
topics_label: Topics
monitored_items: Monitored items
built: built
rss: RSS
calendar: calendar
json: JSON
digest: weekly digest
sister_sites: "Sister sites:"
footer_status: >-
  Prototype. Status badges are computed from stated closing dates: <b>New</b> = opened or first
  seen in the last 14 days; <b>Closing soon</b> = closes within 7 days; <b>Retired</b> = past its
  closing date or withdrawn. Items marked ⚠ have not yet been checked by a human. Always confirm
  deadlines on the official page before submitting.
footer_credit: >-
  © {year} {author}. Code {code_licence}, data {data_licence}. Spotted an error or have feedback?
  Open a pull request on the <a href="{repo}" target="_blank" rel="noopener">original repo</a>.

# add-to-calendar
add_cal: Add deadline to calendar
ics_one: Apple Calendar / .ics file
deadline_prefix: "Deadline:"
cal_unverified: This date has not been checked by a human yet. Confirm it on the official page.
cal_tracked: "Tracked by {site}:"
alarm_7: "{x} closes in 7 days"
alarm_1: "{x} closes tomorrow"
all_cal: Add all deadlines to my calendar
close: Close
all_title: Add every upcoming deadline
all_intro:
  one: One consultation currently has a stated closing date. Subscribing keeps it in sync as items are added, dates change, and closed items drop off.
  other: "{n} consultations currently have stated closing dates. Subscribing keeps them in sync as items are added, dates change, and closed items drop off."
sub_head: Subscribe (stays up to date)
apple_sub: Apple Calendar / other
copy_link: Copy feed link
copied: Link copied
sub_note: Google and Outlook check the feed every few hours. In Google, the calendar appears under “Other calendars”.
once_head: Or add them once
once_note: "A one-time import: the events will not update if a deadline moves."
download:
  one: Download .ics (1 deadline)
  other: "Download .ics ({n} deadlines)"
cal_fine: Each event is all-day on the closing date, with reminders 7 days and 1 day before. Always confirm the deadline on the official page.
no_dated: No open item currently has a stated closing date, so there is nothing to add yet. Subscribe anyway and deadlines will appear as they are published.

# digest and newsletter
week_of: week of
nothing: Nothing this week.
sec_closing: Closing within 7 days
sec_new: New this fortnight
sec_open: Still open
sec_moved: Deadline changed
sec_retired: Recently closed
full_list: Full list
newsletter_open_count: "{n} channels are open in all; the full list, with filters and calendar links, is at {url}."
newsletter_subject: "{title}: {new} new, {closing} closing soon ({date})"   # stock subject when no model writes one
newsletter_intro: >-
  This fortnight: {new} new, {closing} closing within {days} days, {moved} with a changed
  deadline and {retired} closed. Details follow; confirm every deadline on the official page.

# subscribe form (shown only when site.yaml names a newsletter account)
newsletter_head: Get this by email
newsletter_note: A short issue every two weeks with what is new and what is about to close. Unsubscribe in one click.
newsletter_email: Email address
newsletter_button: Subscribe
newsletter_privacy: The list is held by Buttondown; your address is never published or shared.

# Sentence frames the build fills from data/site.yaml `text` (channels, audience, cadence)
# and the item counts. They live here, not in Python, so a site whose primary language
# is not English is not described in English.
meta_description: >-
  Tracking {n} {channels} where {audience} can shape AI governance. {open} open now,
  {soon} closing within 7 days. Each one has a plain-language summary and a concrete
  way to take part. Updated {cadence}.
dataset_description: >-
  Every open channel through which {audience} can shape AI governance: {channels}. Each
  record carries a plain-language summary, why it matters for AI safety, a concrete way
  to take part, and a status derived from the stated closing date.
llms_lead: >-
  Every channel through which {audience} can shape how AI is governed -- {channels} --
  each with a plain-language summary, why it matters for AI safety, and a concrete way
  to take part.
llms_built: >-
  Built {date}. {n} items tracked: {open} open, {soon} closing within 7 days, {retired}
  retired. Curated by hand {cadence}; every record carries a `verified` flag saying
  whether a person has checked its dates and links against the source page.
language_toggle: Language        # accessible name of the language switch

# Server-side date formatting when `date_style` is long: {d} day, {mon} short month, {y} year.
date_format: "{mon} {d}, {y}"
months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
